---
- name: Deploy DocuChain frontend
  gather_facts: true
  hosts: localhost
  become: yes

  tasks:

    # - name: Create project base dir
    #   file:
    #     path: "{{ item }}"
    #     state: directory
    #     mode: '0755'
    #   with_items:
    #     - "/root/app/frontend"

    # - name: Copy repo to base dir
    #   copy:
    #     src: "../"
    #     dest: "/root/app/frontend/"

    - name: Generate dotenv and copy to base dir
      template:
        src: "templates/.env.j2"
        dest: "/root/app/frontend/.env"

    - name: Deploy docker-compose
      community.docker.docker_compose_v2:
        project_src: "/root/app/frontend"
        build: always
        recreate: always
        remove_orphans: true
        env_files:
          - "/root/app/frontend/.env"
        files:
          - "{{ docuchain_frontend.compose_filename | default('docker-compose.yml') }}"
